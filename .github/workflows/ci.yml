name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ matrix.host.platform }} / ${{ matrix.implementation }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: aarch64-darwin
            runner: macos-15
          - platform: x86_64-linux
            runner: ubuntu-24.04
        implementation: [abcl, sbcl, ecl, ccl, mkcl, clisp, cmucl_binary, clasp-common-lisp]
        # All 24 candidates remain visible; pinned packages exclude eight ARM cells.
        exclude:
          - host: {platform: aarch64-linux, runner: ubuntu-24.04-arm}
            implementation: ccl
          - host: {platform: aarch64-linux, runner: ubuntu-24.04-arm}
            implementation: mkcl
          - host: {platform: aarch64-linux, runner: ubuntu-24.04-arm}
            implementation: cmucl_binary
          - host: {platform: aarch64-linux, runner: ubuntu-24.04-arm}
            implementation: clasp-common-lisp
          - host: {platform: aarch64-darwin, runner: macos-15}
            implementation: ccl
          - host: {platform: aarch64-darwin, runner: macos-15}
            implementation: mkcl
          - host: {platform: aarch64-darwin, runner: macos-15}
            implementation: cmucl_binary
          - host: {platform: aarch64-darwin, runner: macos-15}
            implementation: clasp-common-lisp
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_NIX_SYSTEM: ${{ matrix.host.platform }}
      MATRIX_IMPLEMENTATION: ${{ matrix.implementation }}
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify runner architecture
        run: |
          mkdir -p _build/ci
          # Never upload committed evidence as if this job produced it.
          rm -rf "misc/reports/implementations/$MATRIX_IMPLEMENTATION"
          if [ "$MATRIX_IMPLEMENTATION" = sbcl ]; then
            rm -f misc/reports/implementation-matrix.json misc/reports/clean-build.json
            rm -f dist/*.zip
          fi
          exec > >(tee _build/ci/architecture.log) 2>&1
          actual_system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          if [ "$actual_system" != "$EXPECTED_NIX_SYSTEM" ]; then
            echo "Expected $EXPECTED_NIX_SYSTEM, got $actual_system" >&2
            exit 1
          fi

      - name: Require selected package availability
        run: |
          HOLAI_LISP_AVAILABILITY="$(nix eval --raw "path:.#devShells.${EXPECTED_NIX_SYSTEM}.default.HOLAI_LISP_AVAILABILITY")"
          export HOLAI_LISP_AVAILABILITY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          availability = json.loads(os.environ["HOLAI_LISP_AVAILABILITY"])
          Path("_build/ci/lisp-availability.json").write_text(json.dumps(availability, indent=2) + "\n")
          target = os.environ["MATRIX_IMPLEMENTATION"]
          if not availability[target]["available"]:
              raise SystemExit(f"{target} unavailable: {availability[target]['reason']}")
          PY

      - name: Check selected ASDF startup
        run: |
          nix build "path:.#checks.${EXPECTED_NIX_SYSTEM}.asdf-${MATRIX_IMPLEMENTATION}" \
            2>&1 | tee _build/ci/asdf.log

      - name: Build and verify selected implementation
        run: |
          nix develop path:. --command bash -euo pipefail <<'SCRIPT' 2>&1 | tee _build/ci/verification.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ["MATRIX_IMPLEMENTATION"]
          availability = json.loads(os.environ["HOLAI_LISP_AVAILABILITY"])
          status = availability[target]
          if not status["available"]:
              raise SystemExit(f"{target} unavailable: {status['reason']}")
          executable = json.loads(os.environ["HOLAI_LISP_EXECUTABLES"])[target]
          if not Path(executable).is_file() or not os.access(executable, os.X_OK):
              raise SystemExit(f"{target} executable unavailable: {executable}")
          print(f"Selected {target}: {executable}", flush=True)
          PY
          make build
          if [ "$MATRIX_IMPLEMENTATION" = sbcl ]; then
            env HOLAI_LISPS=sbcl make release
          else
            env HOLAI_LISP="$MATRIX_IMPLEMENTATION" python3 holai/tests/compatibility.py
          fi
          SCRIPT

      - name: Upload selected implementation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.host.platform }}-${{ matrix.implementation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/ci/
            misc/reports/implementations/${{ matrix.implementation }}/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload SBCL release evidence
        if: always() && matrix.implementation == 'sbcl'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.host.platform }}-sbcl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            misc/reports/implementation-matrix.json
            misc/reports/clean-build.json
            dist/*.zip
          retention-days: 7
          if-no-files-found: warn
